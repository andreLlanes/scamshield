[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scamshield-backend"
version = "0.1.0"
description = "Agentic AI system for audio scam detection and scam explainability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Base install: the API, the pipeline and the deterministic analyzers all run
# with only these. Heavy model runtimes live in the extras below so a laptop
# without a GPU can still boot the whole system.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "anyio>=4.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Agent 2 — gradient boosted scam classifier.
ml = [
    "xgboost>=2.1",
    "pandas>=2.2",
]
# Agent 1 — Whisper large-v3 speech to text.
asr = [
    "faster-whisper>=1.0.3",
]
# Agent 3 — vector store + bge-small embeddings.
rag = [
    "chromadb>=0.5.15",
    "sentence-transformers>=3.2",
]
# Agents 3/4/5 — CrewAI multi-agent orchestration.
agents = [
    "crewai>=0.80",
]
postgres = ["asyncpg>=0.30"]
aws = ["boto3>=1.35"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
scamshield-train = "scripts.train_classifier:main"
scamshield-seed-kb = "scripts.seed_knowledge_base:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
# No python_version pin: it makes mypy parse installed stubs (numpy's, for one)
# with older syntax rules than the interpreter that produced them.
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
